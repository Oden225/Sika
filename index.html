<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef0fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f1c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Sika : suivez vos dépenses, vos factures, vos tontines et planifiez votre épargne.">
  <title>Sika — Suivi financier</title>
  <script>
    // Thème appliqué avant l'affichage (évite un flash de couleurs) et choix de
    // jouer ou non l'animation d'ouverture (une fois par ouverture de l'app).
    (function () {
      var r = document.documentElement;
      try {
        var t = JSON.parse(localStorage.getItem("sika:theme") || "{}");
        if (t.mode === "light" || t.mode === "dark") r.dataset.theme = t.mode;
        r.dataset.accent = t.accent || "indigo";
        r.dataset.glass = t.glass === "lite" ? "lite" : "full";
        var skip = t.splash === false || matchMedia("(prefers-reduced-motion: reduce)").matches || sessionStorage.getItem("sika:splash");
        if (skip) r.classList.add("no-splash");
        else sessionStorage.setItem("sika:splash", "1");
      } catch (e) {
        r.classList.add("no-splash");
      }
      // Proposition d'installation de Chrome (Android), gardée pour le bouton « Installer ».
      addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__sikaInstall = e;
      });
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Police chargée sans bloquer l'affichage (connexions lentes) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/otp.css">
</head>
<body>
  <!-- Animation d'ouverture : la pièce tourne, « SIKA » (l'argent) apparaît,
       puis le rideau remonte en vague et dévoile l'application. -->
  <div id="splash" aria-hidden="true">
    <div class="splash-panel">
      <div class="splash-center">
        <div class="splash-coin">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <radialGradient id="coinG" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff2b8"/><stop offset=".45" stop-color="#f9c74f"/><stop offset="1" stop-color="#c47f12"/></radialGradient>
            </defs>
            <circle cx="60" cy="60" r="56" fill="url(#coinG)"/>
            <circle cx="60" cy="60" r="45" fill="none" stroke="#9a5b07" stroke-opacity=".35" stroke-width="3"/>
            <path d="M73 46c-2.6-6.4-8.7-10-15.6-10-9.4 0-15.7 5.5-15.7 12.9 0 16.5 32.8 9.4 32.8 26.6 0 7.9-6.9 14-17 14-8.2 0-14.8-4.1-17.6-11.8" fill="none" stroke="#7c2d12" stroke-width="8" stroke-linecap="round"/>
          </svg>
          <i class="coin-shine"></i>
        </div>
        <p class="splash-word"><span>S</span><span>I</span><span>K</span><span>A</span></p>
        <p class="splash-tag">Votre argent, bien géré</p>
      </div>
    </div>
  </div>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <a href="#/" data-tab="home" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="#/calendrier" data-tab="calendar" aria-label="Calendrier">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      <span>Calendrier</span>
    </a>
    <button class="tab-add" data-add-main aria-label="Ajouter une dépense ou un revenu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="#/epargne" data-tab="savings" aria-label="Épargne">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 9.5c.8.3 1.5.9 2 1.5v3h-1.6c-.5 1-1.2 1.8-2.1 2.4V19h-3v-1.6a8 8 0 0 1-3.6 0V19h-3v-2.6A6 6 0 0 1 4 11.5C4 8 7.6 5.5 11.5 5.5c2 0 3.6.5 4.9 1.4L18.5 5v4.5z"/></svg>
      <span>Épargne</span>
    </a>
    <a href="#/plus" data-tab="more" aria-label="Plus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>Plus</span>
    </a>
  </nav>

  <noscript><p style="padding:2rem">Sika a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
